<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DbgAlgo</title>
    <style>
      :root {
        --dbga-text-title: 14px;
        --dbga-text-body: 12px;
        --dbga-text-meta: 11px;
        --dbga-text-micro: 10px;
        --dbga-text-note: 9px;
        --dbga-radius-panel: 6px;
        --dbga-radius-control: 4px;
        --dbga-radius-pill: 999px;
        --dbga-shadow-panel: 0 4px 12px rgba(0, 0, 0, 0.32);
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--vscode-editor-background, #1e1e1e);
        color: var(--vscode-editor-foreground, #cccccc);
        font-family: var(--vscode-font-family, sans-serif);
        font-size: var(--dbga-text-body);
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      .dbga-row,
      .dbga-chip,
      .dbga-marker,
      .dbga-pill,
      .dbga-menuitem,
      .dbga-square,
      .dbga-icon,
      .dbga-zoom,
      .dbga-check {
        font: inherit;
        cursor: pointer;
        border-radius: var(--dbga-radius-control);
      }
      .dbga-row:focus,
      .dbga-chip:focus,
      .dbga-marker:focus,
      .dbga-pill:focus,
      .dbga-menuitem:focus,
      .dbga-square:focus,
      .dbga-icon:focus,
      .dbga-zoom:focus,
      .dbga-check:focus {
        outline: none;
      }
      .dbga-row:focus-visible,
      .dbga-chip:focus-visible,
      .dbga-marker:focus-visible,
      .dbga-pill:focus-visible,
      .dbga-menuitem:focus-visible,
      .dbga-square:focus-visible,
      .dbga-icon:focus-visible,
      .dbga-zoom:focus-visible,
      .dbga-check:focus-visible {
        outline: 1px solid var(--vscode-focusBorder, #007fd4);
        outline-offset: -1px;
      }
      .dbga-row {
        display: flex;
        gap: 6px;
        align-items: baseline;
        width: 100%;
        padding: 1px 4px 1px 8px;
        border: none;
        background: none;
        color: inherit;
        text-align: left;
        white-space: nowrap;
      }
      .dbga-row:hover {
        background-color: var(--vscode-list-hoverBackground, #2a2d2e);
      }
      .dbga-row[aria-pressed='true'] {
        background-color: var(--vscode-list-inactiveSelectionBackground, #37373d);
        box-shadow: inset 2px 0 0 var(--vscode-focusBorder, #007fd4);
      }
      .dbga-pill {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 4px 9px;
        border: 1px solid var(--vscode-editorWidget-border, #333);
        background: var(--vscode-editor-background, #1e1e1e);
        color: var(--vscode-foreground, #cccccc);
        font-family: var(--vscode-font-family, sans-serif);
        font-size: var(--dbga-text-meta);
        white-space: nowrap;
      }
      .dbga-pill:hover {
        background: var(--vscode-toolbar-hoverBackground, #3a3d41);
      }
      .dbga-menuitem {
        display: block;
        width: 100%;
        padding: 5px 10px 5px 8px;
        border: none;
        border-left: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--vscode-foreground, #cccccc);
        font-family: var(--vscode-font-family, sans-serif);
        font-size: var(--dbga-text-body);
        text-align: left;
        white-space: nowrap;
      }
      .dbga-menuitem:hover {
        background: var(--vscode-list-hoverBackground, #2a2d2e);
      }
      .dbga-menuitem[aria-checked='true'] {
        background: var(--vscode-list-inactiveSelectionBackground, #37373d);
        border-left-color: var(--vscode-focusBorder, #007fd4);
        color: var(--vscode-charts-blue, #569cd6);
        font-weight: 600;
      }
      .dbga-chip {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 4px 9px;
        border: none;
        background: var(--vscode-button-secondaryBackground, #3a3d41);
        color: var(--vscode-button-secondaryForeground, #cccccc);
        font-family: var(--vscode-font-family, sans-serif);
        font-size: var(--dbga-text-meta);
        letter-spacing: 0.2px;
      }
      .dbga-chip:hover:not(:disabled):not([aria-pressed='true']) {
        background: var(--vscode-button-secondaryHoverBackground, #45494e);
      }
      .dbga-chip[aria-pressed='true'] {
        background: var(--vscode-button-background, #0e639c);
        color: var(--vscode-button-foreground, #ffffff);
        font-weight: 600;
      }
      .dbga-chip[aria-pressed='true']:hover:not(:disabled) {
        background: var(--vscode-button-hoverBackground, #1177bb);
      }
      .dbga-segment {
        display: flex;
        gap: 2px;
        padding: 2px;
        box-sizing: border-box;
        border: 1px solid var(--vscode-editorWidget-border, #333);
        border-radius: var(--dbga-radius-control);
        background: var(--vscode-editor-background, #1e1e1e);
      }
      .dbga-segment .dbga-chip {
        background: none;
        border-radius: 3px;
      }
      .dbga-segment .dbga-chip:hover:not(:disabled):not([aria-pressed='true']) {
        background: var(--vscode-toolbar-hoverBackground, #3a3d41);
      }
      .dbga-segment .dbga-chip[aria-pressed='true'] {
        background: var(--vscode-button-background, #0e639c);
      }
      .dbga-marker {
        padding: 0 3px;
        box-sizing: border-box;
        border: 1px solid var(--vscode-charts-blue, #569cd6);
        border-radius: 3px;
        background: var(--vscode-editorWidget-background, #252526);
        color: var(--vscode-charts-blue, #569cd6);
        font-family: var(--vscode-editor-font-family, monospace);
      }
      .dbga-marker:hover {
        background: var(--vscode-list-hoverBackground, #2a2d2e);
      }
      .dbga-marker[aria-pressed='true'] {
        border-color: var(--vscode-focusBorder, #007fd4);
        box-shadow: 0 0 0 1px var(--vscode-focusBorder, #007fd4);
      }
      .dbga-sep {
        flex: 0 0 auto;
        align-self: center;
        width: 1px;
        height: 16px;
        background: var(--vscode-editorWidget-border, #333);
      }
      .dbga-square {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        color: var(--vscode-foreground, #cccccc);
        font-family: var(--vscode-editor-font-family, monospace);
        font-size: var(--dbga-text-meta);
      }
      .dbga-square:hover {
        background-color: var(--vscode-list-hoverBackground, #2a2d2e);
      }
      .dbga-square[aria-pressed='true'] {
        background-color: var(--vscode-button-background, #0e639c);
        border-color: var(--vscode-button-background, #0e639c);
        color: var(--vscode-button-foreground, #ffffff);
      }
      .dbga-zoom {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 24px;
        padding: 0 4px;
        border: none;
        background: none;
        color: var(--vscode-foreground, #cccccc);
        font-family: var(--vscode-editor-font-family, monospace);
        font-size: var(--dbga-text-meta);
      }
      .dbga-zoom:hover:not(:disabled) {
        background-color: var(--vscode-toolbar-hoverBackground, #3a3d41);
      }
      .dbga-zoom:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .dbga-zoom-label {
        min-width: 44px;
        letter-spacing: 0.2px;
      }
      .dbga-icon {
        padding: 0 4px;
        border: none;
        background: none;
        color: inherit;
      }
      .dbga-icon:hover {
        background-color: var(--vscode-toolbar-hoverBackground, #3a3d41);
      }
      .dbga-check {
        display: flex;
        gap: 6px;
        align-items: baseline;
        width: 100%;
        padding: 0 4px;
        border: none;
        background: none;
        color: inherit;
        text-align: left;
      }
      .dbga-check:hover {
        background-color: var(--vscode-list-hoverBackground, #2a2d2e);
      }
      .dbga-check[aria-pressed='true'] {
        color: var(--vscode-charts-green, #89d185);
      }
      .dbga-check:disabled,
      .dbga-chip:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .dbga-box {
        position: relative;
        flex: 0 0 auto;
        align-self: center;
        box-sizing: border-box;
        width: 13px;
        height: 13px;
        border: 1px solid #8a8a8a;
        border-radius: 2px;
        background: transparent;
      }
      .dbga-check[aria-pressed='true'] .dbga-box {
        border-color: #2ea043;
        background: #2ea043;
      }
      .dbga-check[aria-pressed='true'] .dbga-box::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 1px;
        width: 3px;
        height: 6px;
        border: solid #ffffff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .dbga-icon-close:hover {
        background-color: rgba(241, 76, 76, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" nonce="%NONCE%" src="%BUNDLE%"></script>
  </body>
</html>
